<div class="page page-workouts">
  <div class="c pt workout-session-header">
    <div class="row sp">
      <h2 class="session-workout-title">{{workoutName}}</h2>
      <span>{{completedSeries}}/{{totalSeries}}</span>
    </div>
    <div class="bar workout-session-progress">
      <i style="width:{{progress}}%"></i>
    </div>
  </div>
  {{exerciseCards}}
  <div class="row">
    {{finishButton}}
    {{exitButton}}
  </div>
  <p class="sub session-hint">Marcar séries é opcional: você pode finalizar direto.</p>
</div>
