<div class="page page-profile">
  <div class="top">
    <h1>Perfil</h1>
  </div>
  <div class="grid">
    <div class="c pt">
      <div class="row">
        <div class="av">{{avatar}}</div>
        <div>
          <h2 class="profile-name">{{name}}</h2>
          <p class="sub">{{age}} anos · {{height}}</p>
        </div>
      </div>
      <div class="profile-edit-action">{{editProfileButton}}</div>
    </div>
    <div class="c lv">
      <div class="row sp">
        <h2>Objetivos</h2>
        {{newGoalButton}}
      </div>
      {{goals}}
    </div>
  </div>
  <div class="c">
    <h2>Configurações</h2>
    {{settings}}
  </div>
  <p class="sub profile-note">Protótipo com dados fictícios.</p>
</div>
