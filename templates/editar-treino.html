<div class="page">
  <header class="workout-editor-header">
    <a class="workout-back-link" href="#treinos" aria-label="Voltar para treinos">{{backIcon}}</a>
    <div>
      <p>ORGANIZE SEU PLANO</p>
      <h1 class="edit-workout-title">{{workoutName}}</h1>
    </div>
  </header>
  <section class="workout-editor-section" aria-labelledby="workout-data-title">
    <div class="workouts-section-heading">
      <div>
        <h2 id="workout-data-title">Sobre o treino</h2>
        <p>Nome, grupos musculares e anotações.</p>
      </div>
    </div>
    {{workoutFields}}
  </section>
  <section class="workout-editor-section" aria-labelledby="exercise-list-title">
    <div class="workouts-section-heading">
      <div>
        <h2 id="exercise-list-title">Exercícios <span>{{exerciseCount}}</span></h2>
        <p>Toque nas setas para mudar a ordem.</p>
      </div>
    </div>
    {{exerciseFields}}
    <div class="editor-add-action">{{addExerciseButton}}</div>
  </section>
  <p class="workout-autosave-note">{{savedIcon}} Alterações salvas automaticamente neste aparelho.</p>
</div>
